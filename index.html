<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>大玉トマト農園 — シミュレーションRPG</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud" class="hud">
        <div class="hud-left">
          <span class="hud-label">所持金</span>
          <span id="hud-cash" class="hud-value">¥ 0</span>
        </div>
        <div class="hud-center">
          <span id="hud-date" class="hud-value">--年 春 1日 06:00</span>
        </div>
        <div class="hud-right">
          <span class="hud-label">Lv</span>
          <span id="hud-level" class="hud-value">1</span>
        </div>
      </header>

      <div id="speed" class="speed-bar" aria-label="ゲーム速度"></div>

      <main id="stage" class="stage">
        <!-- PixiJS Canvas はここに挿入される -->
      </main>

      <footer id="menu" class="menu">
        <button class="menu-btn" data-action="build">建てる</button>
        <button class="menu-btn" data-action="grow">育てる</button>
        <button class="menu-btn" data-action="ship">出荷</button>
        <button class="menu-btn" data-action="status">ステータス</button>
        <button class="menu-btn" data-action="settings">≡</button>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
