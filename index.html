<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <title>大玉トマト農園 — シミュレーションRPG</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud" class="hud">
        <div class="hud-left">
          <span class="hud-label">所持金</span>
          <span id="hud-cash" class="hud-value">¥ 0</span>
        </div>
        <div class="hud-center">
          <span id="hud-date" class="hud-value">--年 春 1日 06:00</span>
        </div>
        <div class="hud-right">
          <button id="bell" class="bell-btn" aria-label="通知">
            <span class="bell-icon">!</span>
            <span id="bell-count" class="bell-badge" hidden>0</span>
          </button>
          <span class="hud-label">Lv</span>
          <span id="hud-level" class="hud-value">1</span>
          <div class="exp-bar-wrap" aria-label="経験値">
            <div id="hud-exp-bar" class="exp-bar"></div>
          </div>
        </div>
      </header>

      <div id="bell-list" class="bell-list" hidden></div>

      <div id="speed" class="speed-bar" aria-label="ゲーム速度"></div>

      <main id="stage" class="stage">
        <!-- PixiJS Canvas はここに挿入される -->
      </main>

      <footer id="menu" class="menu">
        <button class="menu-btn" data-action="build">建てる</button>
        <button class="menu-btn" data-action="grow">育てる</button>
        <button class="menu-btn" data-action="ship">出荷</button>
        <button class="menu-btn" data-action="status">ステータス</button>
        <button class="menu-btn" data-action="settings">≡</button>
      </footer>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <div id="settings" class="modal" hidden>
        <div class="modal-panel">
          <header class="modal-header">
            <h2>設定</h2>
            <button id="settings-close" class="modal-close" aria-label="閉じる">×</button>
          </header>
          <div class="modal-body">
            <section class="settings-section">
              <h3>セーブの持ち運び</h3>
              <p class="settings-note">
                コードをコピーして別端末や別ブラウザに貼り付けると、続きから遊べます。
              </p>
              <textarea
                id="settings-code"
                class="settings-textarea"
                rows="4"
                spellcheck="false"
                placeholder="ここにコードが表示されます"
              ></textarea>
              <div class="settings-buttons">
                <button id="settings-export" class="modal-primary">エクスポート</button>
                <button id="settings-copy" class="ship-btn">コピー</button>
                <button id="settings-import" class="ship-btn">インポート</button>
              </div>
            </section>
            <section class="settings-section">
              <h3>新規開始</h3>
              <p class="settings-note">
                現在の進行を破棄して最初からやり直します。
              </p>
              <button id="settings-reset" class="ship-btn settings-danger">最初からやり直す</button>
            </section>
          </div>
        </div>
      </div>

      <div id="status" class="modal" hidden>
        <div class="modal-panel">
          <header class="modal-header">
            <h2>農園主ステータス</h2>
            <button id="status-close" class="modal-close" aria-label="閉じる">×</button>
          </header>
          <div id="status-body" class="modal-body"></div>
          <footer class="modal-footer">
            <span id="status-points" class="modal-total">SP 0</span>
            <span style="font-size:0.85em;opacity:0.75;">レベルアップで +1 SP</span>
          </footer>
        </div>
      </div>

      <div id="shipping" class="modal" hidden>
        <div class="modal-panel">
          <header class="modal-header">
            <h2>出荷</h2>
            <button id="shipping-close" class="modal-close" aria-label="閉じる">×</button>
          </header>
          <div id="shipping-body" class="modal-body"></div>
          <footer class="modal-footer">
            <span id="shipping-total" class="modal-total">合計 ¥0</span>
            <button id="shipping-ship-all" class="modal-primary">全部出荷</button>
          </footer>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
